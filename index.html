<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Daily task</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#1c1c1a;--muted:#77776f;--line:#e4e3dd;--accent:#2f6f5e}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#202020;--ink:#ecebe6;--muted:#9a9993;--line:#333;--accent:#5fb59d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 150px}
h1{font-size:24px;margin:0}
.date{color:var(--muted);font-size:14px;margin:2px 0 14px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.count{font-size:13px;color:var(--muted);margin-bottom:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 4px 8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.item input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.item span{flex:1;word-break:break-word}
.item.done span{text-decoration:line-through;color:var(--muted)}
.item button{border:0;background:none;color:var(--muted);font-size:22px;padding:0 6px;line-height:1}
.empty{color:var(--muted);font-size:14px;padding:6px 4px}
.h-daily,.h-today,.h-tom{font-weight:800;font-size:14px}
.h-daily{color:var(--ink)}
.h-today{color:#c98a00}
.h-bl{color:#c0392b;font-weight:800;font-size:14px}
.h-tom{color:#2f9e5f}
@media(prefers-color-scheme:dark){.h-bl{color:#ef8a7e}.h-today{color:#f5c542}.h-tom{color:#5fd08a}}
.item.backlog{border-left:4px solid #c0392b}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 12px;margin-bottom:8px}
.box .empty{padding:14px 4px}
.iditem button.arm{font-size:13px;background:var(--bad);color:#fff;border-radius:8px;padding:5px 8px;line-height:1.2;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bulb{position:relative;flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0}
.bulb svg{width:27px;height:27px}
.bulb .bd{position:absolute;top:-4px;right:-4px;background:#2f9e5f;color:#fff;border-radius:10px;font-size:11px;font-weight:700;min-width:19px;height:19px;line-height:19px;text-align:center;padding:0 5px}
.bulb .bd:empty{display:none}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(520px,94vw);max-height:88vh;padding:16px;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dh strong{font-size:18px}
.dh button{border:0;background:none;color:var(--muted);font-size:26px;line-height:1;padding:0 4px}
textarea#it{display:block;width:100%;font:inherit;font-size:18px;line-height:1.4;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;resize:none;min-height:84px;max-height:40vh}
textarea#it:focus{outline:2px solid var(--accent)}
.save{display:block;width:100%;margin-top:10px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:17px;font-weight:600;padding:13px}
.iditem{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
.iditem:last-child{border-bottom:0}
.iditem input{width:26px;height:26px;accent-color:#2f9e5f;flex:none;margin-top:1px}
.iditem .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.iditem .tx small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.iditem.done .tx{color:var(--muted)}
.iditem.done .tx span{text-decoration:line-through}
.iditem button{flex:none;border:0;background:none;color:var(--muted);font-size:22px;padding:0 4px;line-height:1}
.iditem button.p{font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:5px 8px;line-height:1.2;white-space:nowrap}
.idh{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 2px 2px}
.item.future{border-left:4px solid #6aa0d8}
.item small{color:var(--muted);font-size:12px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
#dateRow{margin-bottom:8px;align-items:center;gap:10px;color:var(--muted);font-size:14px}
#dateRow input{flex:1;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.hide{display:none!important}
.item button.p{flex:none;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:5px 9px;line-height:1.2;white-space:nowrap}
form{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.row{max-width:560px;margin:0 auto;display:flex;gap:8px}
textarea#t{display:block;width:100%;font:inherit;font-size:18px;line-height:1.4;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;resize:none;min-height:76px;max-height:40vh;overflow-y:auto}
textarea#t:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
#ctl{margin-top:8px}
#ctl select{flex:1;min-width:0;font-size:16px;padding:12px 10px}
#ctl .go{font-size:17px;padding:0 26px}
select,.go{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 8px}
.go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;padding:0 16px}
.clear{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Daily task</h1><div class="date" id="date"></div></div>
    <button class="bulb" id="bulb" type="button" aria-label="New ideas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8a6.2 6.2 0 0 0-3.7 11.2c.6.5 1 1.2 1 2v.5h5.4V16c0-.8.4-1.5 1-2A6.2 6.2 0 0 0 12 2.8z" fill="#f5c542" stroke="#b7791f" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.6 19.2h4.8M10.4 21.4h3.2" stroke="#8a8a82" stroke-width="1.6" stroke-linecap="round"/></svg><span class="bd" id="bdg"></span></button>
  </div>
  <div class="prog"><i id="bar"></i></div>
  <div class="count" id="count"></div>
  <h2 class="h-daily">Repeating daily tasks</h2>
  <div id="daily"></div>
  <h2 class="h-today">Today · <span id="todayDate"></span></h2>
  <div id="once"></div>
  <h2 class="h-bl">Backlog · <span id="blCount">0</span></h2>
  <div id="backlog"></div>
  <h2 class="h-tom">Tomorrow · <span id="tomDate"></span></h2>
  <div id="tomorrow"></div>
  <div id="laterWrap"><h2>Upcoming</h2><div id="later"></div></div>
  <button class="clear" id="clear">Clear completed tasks</button>
  <h2>💡 Ideas · <span id="ideaCount">0</span></h2>
  <div id="ideas" class="box"></div>
  <div id="ideaDoneWrap"><h2>Completed ideas · <span id="ideaDoneCount">0</span></h2><div id="ideasDone" class="box"></div></div>
</div>
<form id="f" autocomplete="off">
  <div class="row hide" id="dateRow"><label for="dt">Do it on</label><input type="date" id="dt"></div>
  <div class="row"><textarea id="t" rows="2" placeholder="Add a task… (one per line)" maxlength="600" spellcheck="true" autocorrect="on" autocapitalize="sentences" lang="en" enterkeyhint="enter" aria-label="Task"></textarea></div>
  <div class="row" id="ctl">
    <select id="k" aria-label="Add to"><option value="once">Today</option><option value="tom">Tomorrow</option><option value="pick">Pick a date…</option><option value="daily">Every day</option></select>
    <button class="go" type="submit">Add</button>
  </div>
</form>
<dialog id="idDlg">
  <div class="dh"><strong>💡 New idea</strong><button type="button" id="idClose" aria-label="Close">×</button></div>
  <textarea id="it" rows="3" maxlength="600" placeholder="Write down your idea…" spellcheck="true" autocorrect="on" autocapitalize="sentences" lang="en" aria-label="Idea"></textarea>
  <button class="save" type="button" id="idSave">Save idea</button>
</dialog>
<div class="toast" id="toast"></div>
<script>
(function(){
  var KEY="viec-hang-ngay-v1", $=function(s){return document.querySelector(s)};
  var s={items:[],day:""};
  function today(){var d=new Date(),z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
  function shift(iso,n){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n),z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
  var WD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function nice(iso,withYear){var p=iso.split("-");return MON[+p[1]-1]+" "+(+p[2])+(withYear?", "+p[0]:"")}
  function lbl(iso){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return WD[d.getDay()]+", "+nice(iso)}
  function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},1700)}
  function load(){try{var raw=localStorage.getItem(KEY);if(raw&&!localStorage.getItem(KEY+"-bak1"))localStorage.setItem(KEY+"-bak1",raw);var r=JSON.parse(raw);if(r&&r.items)s=r}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
  function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function rollover(){
    var t=today();
    if(s.day!==t){
      s.items=s.items.filter(function(i){return i.kind!=="once"||!i.done||(i.for&&i.for>=t)}); // drop finished one-off tasks, keep unfinished ones
      s.items.forEach(function(i){if(i.kind==="daily")i.done=false;if(i.kind==="once"&&!i.done&&(!i.for||i.for<t))i.bl=true}); // unfinished tasks from earlier days go to the backlog
      s.day=t;save();
    }
  }
  function row(i){
    return '<div class="item'+(i.done?' done':'')+'"><input type="checkbox" data-c="'+i.id+'"'+(i.done?' checked':'')+'><span>'+esc(i.text)+'</span><button data-d="'+i.id+'" aria-label="Delete">×</button></div>';
  }
  function ideaRow(i){
    var at=(i.at?'Added '+nice(i.at,true):"")+(i.done&&i.doneAt?' · Done '+nice(i.doneAt,true):"");
    return '<div class="iditem'+(i.done?' done':'')+'"><input type="checkbox" data-c="'+i.id+'"'+(i.done?' checked':'')+' aria-label="Completed"><div class="tx"><span>'+esc(i.text)+'</span><small>'+at+'</small></div>'+(i.done?'':'<button class="p" data-p="'+i.id+'" aria-label="Add a copy to today\'s tasks">→ Task</button>')+'<button data-di="'+i.id+'" aria-label="Delete idea">×</button></div>';
  }
  function byDate(a,b){var x=a.at||"",y=b.at||"";return x<y?1:x>y?-1:0}
  function renderIdeas(){
    var all=s.items.filter(function(i){return i.kind==="idea"});
    var open=all.filter(function(i){return!i.done}).sort(byDate);
    var done=all.filter(function(i){return i.done}).sort(function(a,b){var x=a.doneAt||a.at||"",y=b.doneAt||b.at||"";return x<y?1:x>y?-1:0});
    $("#bdg").textContent=open.length?String(open.length):"";
    $("#ideaCount").textContent=open.length;
    $("#ideas").innerHTML=open.length?open.map(ideaRow).join(""):'<div class="empty">No ideas yet. Tap the 💡 at the top to add one.</div>';
    $("#ideaDoneWrap").classList.toggle("hide",!done.length);
    $("#ideaDoneCount").textContent=done.length;
    $("#ideasDone").innerHTML=done.map(ideaRow).join("");
  }
  function backlogRow(i){
    return '<div class="item backlog'+(i.done?' done':'')+'"><input type="checkbox" data-c="'+i.id+'"'+(i.done?' checked':'')+'><span>'+esc(i.text)+'</span>'+(i.done?'':'<button class="p" data-t2="'+i.id+'" aria-label="Move to today">→ Today</button>')+'<button data-d="'+i.id+'" aria-label="Delete">×</button></div>';
  }
  function futureRow(i,showDate){
    return '<div class="item future"><span>'+esc(i.text)+(showDate?'<small>'+lbl(i.for)+'</small>':'')+'</span><button class="p" data-t2="'+i.id+'" aria-label="Move to today">→ Today</button><button data-d="'+i.id+'" aria-label="Delete">×</button></div>';
  }
  function render(){
    $("#date").textContent=new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
    var T=today(),TM=shift(T,1);
    var d=s.items.filter(function(i){return i.kind==="daily"}),
        o=s.items.filter(function(i){return i.kind==="once"&&!i.bl&&(!i.for||i.for<=T)}),
        bl=s.items.filter(function(i){return i.kind==="once"&&i.bl}),
        tm=s.items.filter(function(i){return i.kind==="once"&&i.for===TM}),
        lt=s.items.filter(function(i){return i.kind==="once"&&i.for>TM}).sort(function(a,b){return a.for<b.for?-1:1});
    $("#tomDate").textContent=lbl(TM);$("#todayDate").textContent=lbl(T);
    $("#tomorrow").innerHTML=tm.map(function(i){return futureRow(i,false)}).join("")||'<div class="empty">Nothing yet. Choose "Tomorrow" below to plan before bed.</div>';
    $("#laterWrap").classList.toggle("hide",!lt.length);
    $("#later").innerHTML=lt.map(function(i){return futureRow(i,true)}).join("");
    $("#daily").innerHTML=d.map(row).join("")||'<div class="empty">Nothing yet. Choose "Every day" when adding.</div>';
    $("#once").innerHTML=o.map(row).join("")||'<div class="empty">No tasks for today.</div>';
    var blOpen=bl.filter(function(i){return!i.done}).length;
    $("#blCount").textContent=blOpen;
    $("#backlog").innerHTML=bl.map(backlogRow).join("")||'<div class="empty">Nothing left over. Unfinished tasks from earlier days land here.</div>';
    renderIdeas();
    var tasks=d.concat(o),n=tasks.length,k=tasks.filter(function(i){return i.done}).length;
    $("#bar").style.width=(n?k/n*100:0)+"%";
    $("#count").textContent=(n?(k+" of "+n+" done"):"Add your first task below")+(blOpen?" · "+blOpen+" in backlog":"");
  }
  function syncSel(){var v=$("#k").value;$("#t").placeholder=v==="tom"?"Task for tomorrow…":v==="pick"?"Task name…":"Add a task… (one per line)";$("#dateRow").classList.toggle("hide",v!=="pick");if(v==="pick"&&!$("#dt").value)$("#dt").value=shift(today(),2)}
  $("#k").addEventListener("change",syncSel);
  function fitForm(){
    var t=$("#t");t.style.height="auto";t.style.height=Math.min(t.scrollHeight+2,window.innerHeight*0.4)+"px";
    var h=$("#f").offsetHeight;$(".wrap").style.paddingBottom=(h+24)+"px";$("#toast").style.bottom=(h+12)+"px";
  }
  $("#t").addEventListener("input",fitForm);window.addEventListener("resize",fitForm);
  $("#f").addEventListener("submit",function(e){
    e.preventDefault();
    var lines=$("#t").value.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean);if(!lines.length)return;
    var sel=$("#k").value,T=today(),kind=(sel==="tom"||sel==="pick")?"once":sel,fd="";
    if(sel==="tom")fd=shift(T,1);
    if(sel==="pick"){fd=$("#dt").value;if(!fd){toast("Pick a date");return}if(fd<=T)fd=""}
    lines.forEach(function(v,n){s.items.push({id:Date.now().toString(36)+n+Math.random().toString(36).slice(2,5),text:v,kind:kind,done:false,for:fd})});
    $("#t").value="";save();render();fitForm();
    var c=lines.length>1?(lines.length+" tasks"):"task";
    toast(sel==="tom"?"Added "+c+" to Tomorrow":sel==="pick"&&fd?("Added "+c+" to "+lbl(fd)):sel==="daily"?"Added "+c+" to daily repeats":"Added "+c+" to Today");
  });
  var itx=$("#it");
  function fitIdea(){itx.style.height="auto";itx.style.height=Math.min(itx.scrollHeight+2,window.innerHeight*0.4)+"px"}
  itx.addEventListener("input",fitIdea);
  $("#bulb").onclick=function(){$("#idDlg").showModal();setTimeout(function(){itx.focus()},50)};
  $("#idClose").onclick=function(){$("#idDlg").close()};
  $("#idSave").onclick=function(){
    var v=itx.value.trim();if(!v){itx.focus();return}
    s.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),text:v,kind:"idea",done:false,for:"",at:today()});
    itx.value="";fitIdea();save();render();$("#idDlg").close();toast("Idea saved");
  };
  document.addEventListener("click",function(e){
    var c=e.target.getAttribute&&e.target.getAttribute("data-c"),d=e.target.getAttribute&&e.target.getAttribute("data-d"),pr=e.target.getAttribute&&e.target.getAttribute("data-p"),t2=e.target.getAttribute&&e.target.getAttribute("data-t2");
    var di=e.target.getAttribute&&e.target.getAttribute("data-di");
    if(t2){s.items.forEach(function(i){if(i.id===t2){i.for="";i.bl=false}});save();render();toast("Moved to today")}
    if(pr){var src=s.items.filter(function(i){return i.id===pr})[0];if(src){s.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),text:src.text,kind:"once",done:false,for:""});save();render();toast("Added to Today (idea kept)")}}
    if(c){s.items.forEach(function(i){if(i.id===c){i.done=e.target.checked;if(i.kind==="idea")i.doneAt=i.done?today():""}});save();render()}
    if(di){var b=e.target;if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="Delete?";clearTimeout(b._h);b._h=setTimeout(function(){b.classList.remove("arm");b.textContent="×"},3000)}else{s.items=s.items.filter(function(i){return i.id!==di});save();render()}}
    if(d){s.items=s.items.filter(function(i){return i.id!==d});save();render()}
  });
  $("#clear").onclick=function(){s.items=s.items.filter(function(i){return i.kind!=="once"||!i.done});save();render()};
  document.addEventListener("visibilitychange",function(){if(!document.hidden){rollover();render()}});
  load();
  s.items.forEach(function(i){if(i.kind==="idea"&&!i.at)i.at=s.day||today()});
  rollover();render();
  if(new Date().getHours()>=20)$("#k").value="tom";
  syncSel();fitForm();
})();
</script>
</body>
</html>
