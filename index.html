<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Việc hằng ngày</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#1c1c1a;--muted:#77776f;--line:#e4e3dd;--accent:#2f6f5e}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#202020;--ink:#ecebe6;--muted:#9a9993;--line:#333;--accent:#5fb59d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 150px}
h1{font-size:24px;margin:0}
.date{color:var(--muted);font-size:14px;margin:2px 0 14px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.count{font-size:13px;color:var(--muted);margin-bottom:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 4px 8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.item input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.item span{flex:1;word-break:break-word}
.item.done span{text-decoration:line-through;color:var(--muted)}
.item button{border:0;background:none;color:var(--muted);font-size:22px;padding:0 6px;line-height:1}
.empty{color:var(--muted);font-size:14px;padding:6px 4px}
.item.idea{border-left:4px solid #e9b94a}
.item.future{border-left:4px solid #6aa0d8}
.item small{color:var(--muted);font-size:12px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
#dateRow{margin-bottom:8px;align-items:center;gap:10px;color:var(--muted);font-size:14px}
#dateRow input{flex:1;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.hide{display:none!important}
.item button.p{flex:none;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:5px 9px;line-height:1.2;white-space:nowrap}
form{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.row{max-width:560px;margin:0 auto;display:flex;gap:8px}
textarea#t{display:block;width:100%;font:inherit;font-size:18px;line-height:1.4;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;resize:none;min-height:76px;max-height:40vh;overflow-y:auto}
textarea#t:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
#ctl{margin-top:8px}
#ctl select{flex:1;min-width:0;font-size:16px;padding:12px 10px}
#ctl .go{font-size:17px;padding:0 26px}
select,.go{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 8px}
.go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;padding:0 16px}
.clear{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <h1>Việc hằng ngày</h1>
  <div class="date" id="date"></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="count" id="count"></div>
  <h2>Việc lặp mỗi ngày</h2>
  <div id="daily"></div>
  <h2>Việc hôm nay</h2>
  <div id="once"></div>
  <h2>Ngày mai · <span id="tomDate"></span></h2>
  <div id="tomorrow"></div>
  <div id="laterWrap"><h2>Sắp tới</h2><div id="later"></div></div>
  <h2>Ý tưởng mới</h2>
  <div id="ideas"></div>
  <button class="clear" id="clear">Xóa các việc đã xong</button>
</div>
<form id="f" autocomplete="off">
  <div class="row hide" id="dateRow"><label for="dt">Làm vào ngày</label><input type="date" id="dt"></div>
  <div class="row"><textarea id="t" rows="2" placeholder="Thêm việc cần làm… (mỗi dòng là một việc)" maxlength="600" spellcheck="true" autocorrect="on" autocapitalize="sentences" lang="vi" enterkeyhint="enter" aria-label="Nội dung"></textarea></div>
  <div class="row" id="ctl">
    <select id="k" aria-label="Thêm vào"><option value="once">Hôm nay</option><option value="tom">Ngày mai</option><option value="pick">Chọn ngày…</option><option value="daily">Mỗi ngày</option><option value="idea">Ý tưởng</option></select>
    <button class="go" type="submit">Thêm</button>
  </div>
</form>
<div class="toast" id="toast"></div>
<script>
(function(){
  var KEY="viec-hang-ngay-v1", $=function(s){return document.querySelector(s)};
  var s={items:[],day:""};
  function today(){var d=new Date(),z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
  function shift(iso,n){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n),z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
  var WD=["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
  function lbl(iso){var p=iso.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return WD[d.getDay()]+" "+p[2]+"/"+p[1]}
  function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},1700)}
  function load(){try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&r.items)s=r}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
  function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function rollover(){
    var t=today();
    if(s.day!==t){
      s.items=s.items.filter(function(i){return i.kind!=="once"||!i.done||(i.for&&i.for>=t)}); // việc hôm qua đã xong thì bỏ, chưa xong thì giữ lại
      s.items.forEach(function(i){if(i.kind==="daily")i.done=false});
      s.day=t;save();
    }
  }
  function row(i){
    return '<div class="item'+(i.done?' done':'')+'"><input type="checkbox" data-c="'+i.id+'"'+(i.done?' checked':'')+'><span>'+esc(i.text)+'</span><button data-d="'+i.id+'" aria-label="Xóa">×</button></div>';
  }
  function ideaRow(i){
    return '<div class="item idea"><span>'+esc(i.text)+'</span><button class="p" data-p="'+i.id+'" aria-label="Chuyển thành việc hôm nay">→ Việc</button><button data-d="'+i.id+'" aria-label="Xóa">×</button></div>';
  }
  function futureRow(i,showDate){
    return '<div class="item future"><span>'+esc(i.text)+(showDate?'<small>'+lbl(i.for)+'</small>':'')+'</span><button class="p" data-t2="'+i.id+'" aria-label="Chuyển sang hôm nay">→ Hôm nay</button><button data-d="'+i.id+'" aria-label="Xóa">×</button></div>';
  }
  function render(){
    $("#date").textContent=new Date().toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"long"});
    var T=today(),TM=shift(T,1);
    var d=s.items.filter(function(i){return i.kind==="daily"}),
        o=s.items.filter(function(i){return i.kind==="once"&&(!i.for||i.for<=T)}),
        tm=s.items.filter(function(i){return i.kind==="once"&&i.for===TM}),
        lt=s.items.filter(function(i){return i.kind==="once"&&i.for>TM}).sort(function(a,b){return a.for<b.for?-1:1});
    $("#tomDate").textContent=lbl(TM);
    $("#tomorrow").innerHTML=tm.map(function(i){return futureRow(i,false)}).join("")||'<div class="empty">Chưa có. Chọn "Ngày mai" ở ô bên dưới để lên danh sách trước khi ngủ.</div>';
    $("#laterWrap").classList.toggle("hide",!lt.length);
    $("#later").innerHTML=lt.map(function(i){return futureRow(i,true)}).join("");
    $("#daily").innerHTML=d.map(row).join("")||'<div class="empty">Chưa có. Chọn "Mỗi ngày" khi thêm.</div>';
    $("#once").innerHTML=o.map(row).join("")||'<div class="empty">Chưa có việc nào cho hôm nay.</div>';
    var ideas=s.items.filter(function(i){return i.kind==="idea"});
    $("#ideas").innerHTML=ideas.map(ideaRow).join("")||'<div class="empty">Có ý tưởng gì hay thì ghi lại ở đây. Chọn "Ý tưởng" khi thêm.</div>';
    var tasks=d.concat(o),n=tasks.length,k=tasks.filter(function(i){return i.done}).length;
    $("#bar").style.width=(n?k/n*100:0)+"%";
    $("#count").textContent=n?("Đã xong "+k+"/"+n+" việc"):"Hãy thêm việc đầu tiên bên dưới";
  }
  function syncSel(){var v=$("#k").value;$("#t").placeholder=v==="idea"?"Ghi một ý tưởng mới…":v==="tom"?"Việc ngày mai…":v==="pick"?"Tên việc…":"Thêm việc cần làm… (mỗi dòng là một việc)";$("#dateRow").classList.toggle("hide",v!=="pick");if(v==="pick"&&!$("#dt").value)$("#dt").value=shift(today(),2)}
  $("#k").addEventListener("change",syncSel);
  function fitForm(){
    var t=$("#t");t.style.height="auto";t.style.height=Math.min(t.scrollHeight+2,window.innerHeight*0.4)+"px";
    var h=$("#f").offsetHeight;$(".wrap").style.paddingBottom=(h+24)+"px";$("#toast").style.bottom=(h+12)+"px";
  }
  $("#t").addEventListener("input",fitForm);window.addEventListener("resize",fitForm);
  $("#f").addEventListener("submit",function(e){
    e.preventDefault();
    var lines=$("#t").value.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean);if(!lines.length)return;
    var sel=$("#k").value,T=today(),kind=(sel==="tom"||sel==="pick")?"once":sel,fd="";
    if(sel==="tom")fd=shift(T,1);
    if(sel==="pick"){fd=$("#dt").value;if(!fd){toast("Hãy chọn ngày");return}if(fd<=T)fd=""}
    lines.forEach(function(v,n){s.items.push({id:Date.now().toString(36)+n+Math.random().toString(36).slice(2,5),text:v,kind:kind,done:false,for:fd})});
    $("#t").value="";save();render();fitForm();
    var c=lines.length>1?(lines.length+" việc"):"";
    toast(sel==="tom"?"Đã thêm "+c+" vào Ngày mai":sel==="pick"&&fd?("Đã thêm "+c+" vào "+lbl(fd)):sel==="daily"?"Đã thêm "+c+" vào việc lặp mỗi ngày":sel==="idea"?"Đã ghi ý tưởng":"Đã thêm "+c+" vào hôm nay");
  });
  document.addEventListener("click",function(e){
    var c=e.target.getAttribute&&e.target.getAttribute("data-c"),d=e.target.getAttribute&&e.target.getAttribute("data-d"),pr=e.target.getAttribute&&e.target.getAttribute("data-p"),t2=e.target.getAttribute&&e.target.getAttribute("data-t2");
    if(t2){s.items.forEach(function(i){if(i.id===t2){i.for=""}});save();render();toast("Đã chuyển sang hôm nay")}
    if(pr){s.items.forEach(function(i){if(i.id===pr){i.kind="once";i.done=false}});save();render()}
    if(c){s.items.forEach(function(i){if(i.id===c)i.done=e.target.checked});save();render()}
    if(d){s.items=s.items.filter(function(i){return i.id!==d});save();render()}
  });
  $("#clear").onclick=function(){s.items=s.items.filter(function(i){return i.kind!=="once"||!i.done});save();render()};
  document.addEventListener("visibilitychange",function(){if(!document.hidden){rollover();render()}});
  load();rollover();render();
  if(new Date().getHours()>=20)$("#k").value="tom";
  syncSel();fitForm();
})();
</script>
</body>
</html>
